name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "33 4 * * 0"

jobs:
  analyze:
    permissions:
      security-events: write
    runs-on: "ubuntu-latest"
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            queries:
              - uses: security-and-quality
            # Alembic migrations declare `revision` / `down_revision` /
            # `branch_labels` / `depends_on`, which Alembic reads by
            # introspection and never from the module itself. CodeQL sees
            # them as dead code and reports py/unused-global-variable.
            paths-ignore:
              - alembic/versions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
